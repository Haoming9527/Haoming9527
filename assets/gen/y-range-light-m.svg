<svg xmlns="http://www.w3.org/2000/svg" width="178.4" height="40" viewBox="0 0 178.4 40" role="img" aria-label="Yearly view; changes over 1Y">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}.draw{stroke-dasharray:1;animation:draw 1.4s cubic-bezier(.3,.7,.2,1) both}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(3.2);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.0" y="0.0" width="178.4" height="40.0" rx="0" fill="#ffffff"/>
<text x="174.4" y="25.4" font-size="15" font-weight="500" fill="#59636e" text-anchor="end">1Y</text>
<text x="145.2" y="25.4" font-size="15" font-weight="600" fill="#1f2328" text-anchor="end">Yearly</text>
</svg>
